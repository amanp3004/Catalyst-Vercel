name: Send Weekly Email Digest

on:
  schedule:
    # 01:15 UTC = 6:45 AM IST, every Saturday only (day-of-week 6 = Saturday).
    # Runs after daily-edition.yml's 18:40 UTC (12:10 AM IST) generation, so
    # that day's edition — including any Founders' Friday content carried
    # over from the day before, if that's how your content cadence works —
    # is already committed before this sends.
    - cron: "15 1 * * 6"
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python send_weekly_digest.py
