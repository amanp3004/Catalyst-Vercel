name: Generate Daily Catalyst Edition

on:
  schedule:
    # 18:40 UTC = 12:10 AM IST (the following IST calendar day).
    - cron: "40 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python generate_edition.py

      - name: Commit updated data
        run: |
          git config user.name "catalyst-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: today's Catalyst edition"
          git push

      # No deploy step needed — Vercel is connected directly to this repo
      # and automatically redeploys on every push to main, including this
      # commit. The old "Upload site artifact" / GitHub Pages deploy steps
      # that used to live here were dead weight (added execution time for
      # an artifact that was never actually deployed) and have been removed.
