name: Generate Daily Catalyst Edition

on:
  schedule:
    # Same day's edition is generated at most once. These are a safety net
    # against a run failing outright (e.g. a Gemini ReadTimeout that
    # exhausts all retries), not separate editions — once one run
    # succeeds, every later trigger that same day skips almost instantly
    # (see "Check if today's edition already exists" below, which runs
    # before checkout/Python setup/pip install, so a no-op run costs a
    # couple of seconds, not the full job); if a run fails, the next one
    # gets a fresh attempt from scratch, since a failed run never reaches
    # the point where it creates that day's file.
    - cron: "40 18 * * *"  # 18:40 UTC = 12:10 AM IST — primary run
    - cron: "40 20 * * *"  # 20:40 UTC = 2:10 AM IST
    - cron: "40 22 * * *"  # 22:40 UTC = 4:10 AM IST
    - cron: "40 0 * * *"   # 00:40 UTC = 6:10 AM IST
    - cron: "40 2 * * *"   # 02:40 UTC = 8:10 AM IST
    - cron: "40 4 * * *"   # 04:40 UTC = 10:10 AM IST
    - cron: "40 6 * * *"   # 06:40 UTC = 12:10 PM IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Deliberately the ONLY step that always runs, and deliberately
      # checkout-free — it asks GitHub's API directly whether
      # data/{today}.json (IST) already exists on main, without needing
      # to clone the repo first. Every step below is conditional on this
      # one, so a day that's already succeeded costs a couple of seconds
      # per extra scheduled trigger instead of a full checkout + Python
      # setup + pip install (which is where the real time/minutes go).
      - name: Check if today's edition already exists
        id: check
        run: |
          TODAY=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/data/${TODAY}.json?ref=main")
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "data/${TODAY}.json already exists on main — skipping the rest of this run."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "data/${TODAY}.json not found yet (HTTP $STATUS) — proceeding with generation."
          fi

      - name: Checkout repo
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.exists != 'true'
        run: pip install -r requirements.txt

      - name: Generate today's edition
        if: steps.check.outputs.exists != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python generate_edition.py

      - name: Commit updated data
        if: steps.check.outputs.exists != 'true'
        run: |
          git config user.name "catalyst-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: today's Catalyst edition"
          git push

      # No deploy step needed — Vercel is connected directly to this repo
      # and automatically redeploys on every push to main, including this
      # commit. The old "Upload site artifact" / GitHub Pages deploy steps
      # that used to live here were dead weight (added execution time for
      # an artifact that was never actually deployed) and have been removed.
