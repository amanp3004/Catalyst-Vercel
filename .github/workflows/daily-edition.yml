name: Generate Daily Catalyst Edition

on:
  schedule:
    # Same day's edition is generated at most once — generate_edition.py
    # itself locks content as soon as data/{today}.json exists, and every
    # run below checks that before doing anything else (collecting
    # stories, calling Gemini, etc.), so a run that finds it already
    # exists just exits immediately at near-zero cost. These runs are a
    # safety net against a run failing outright (e.g. a Gemini ReadTimeout
    # that exhausts all retries) rather than separate editions — once one
    # run succeeds, every later one that same day is a no-op; if a run
    # fails, the next one gets a fresh attempt from scratch, since a
    # failed run never reaches the point where it creates that lock file.
    - cron: "40 18 * * *"  # 18:40 UTC = 12:10 AM IST — primary run
    - cron: "40 20 * * *"  # 20:40 UTC = 2:10 AM IST
    - cron: "40 22 * * *"  # 22:40 UTC = 4:10 AM IST
    - cron: "40 0 * * *"   # 00:40 UTC = 6:10 AM IST
    - cron: "40 2 * * *"   # 02:40 UTC = 8:10 AM IST
    - cron: "40 4 * * *"   # 04:40 UTC = 10:10 AM IST
    - cron: "40 6 * * *"   # 06:40 UTC = 12:10 PM IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python generate_edition.py

      - name: Commit updated data
        run: |
          git config user.name "catalyst-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: today's Catalyst edition"
          git push

      # No deploy step needed — Vercel is connected directly to this repo
      # and automatically redeploys on every push to main, including this
      # commit. The old "Upload site artifact" / GitHub Pages deploy steps
      # that used to live here were dead weight (added execution time for
      # an artifact that was never actually deployed) and have been removed.
