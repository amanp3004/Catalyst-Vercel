name: Send Morning Notification

on:
  schedule:
    # 01:00 UTC = 6:30 AM IST — after daily-edition.yml's 18:40 UTC
    # (12:10 AM IST) run, so content is guaranteed ready before this
    # notification tells people to go read it.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send morning notification
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python send_morning_notification.py
